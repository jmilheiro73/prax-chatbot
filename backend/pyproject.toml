[project]
name = "prax-chatbot"
version = "0.1.0"
description = "Prax · P1 (chatbot scaffold) + D3 (checkpoint Redis, sumarização, LangSmith)"
authors = [
    { name = "Juan", email = "softwaregx@gulloxavier.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langchain-core>=1.6.6",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-redis>=0.5.2",
    "numpy>=2.0",
    "pydantic-settings>=2.15.0",
    "redisvl>=0.27.2",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
